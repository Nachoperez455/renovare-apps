  tips:[
   ['Mânere care chiar se potrivesc','Măsoară distanța dintre centrele găurilor existente, nu lungimea totală a mânerului. Cumpără mai întâi o singură bucată de probă.','Mânerul nou trebuie să permită deschiderea completă a ușilor și sertarelor.'],

   ['Textilele care leagă paleta','Alege o culoare principală și un accent din combinația salvată. Repetă-le în prosoape sau o perdea simplă.','Materialele trebuie să fie ușor de spălat și ținute departe de plită.'],
   ['Spatele ușii de dulap','Folosește un organizator dimensionat pentru ușă și verifică dacă se închide fără să atingă raftul.','Respectă sarcina admisă și testează orice adeziv pe finisaj.'],
   ['Colțul de cafea ordonat','Adună cănile, cafeaua și consumabilele într-o zonă compactă. Folosește o tavă lavabilă care protejează blatul.','Păstrează spațiul de ventilație al aparatului.'],

function photo(s,cls='room-photo'){const i=data.schemes.findIndex(x=>x.id===s.id);return `<img class="${cls}" src="${asset(kind+'-'+i+'.webp')}" alt="Exemplu vizual: ${esc(s.name)}" loading="lazy" width="512" height="512">`;}
function compareView(){return `<div class="visual-example"><div class="section-label">UN EXEMPLU VIZUAL · IMAGINI ILUSTRATIVE</div><div class="comparison"><div class="comparison-after"></div><div class="comparison-before"></div><span class="compare-before-label">Înainte</span><span class="compare-after-label">După</span><i class="compare-handle" aria-hidden="true">↔</i><input type="range" min="0" max="100" value="50" data-compare aria-label="Compară înainte și după"></div><p>Același tip de cameră: ordine, textile coordonate și lumină. Glisează pentru comparație.</p></div>`;}
function recommended(){const p=state.profile;return data.schemes.slice().sort((a,b)=>((b.style===p.style?3:0)+(b.keep.includes(p.keep)?4:0))-((a.style===p.style?3:0)+(a.keep.includes(p.keep)?4:0)));}
function activeSteps(){
 if(staging)return stageSteps();
 return data.steps.map((s,i)=>({id:'task-'+i,day:s[0],group:s[1],title:s[2],body:s[3],time:s[4]})).map(s=>{
  if(state.profile.scope==='refresh'||state.profile.tenure==='renter'){
   if(s.id==='task-2'&&kind==='kitchen')return {...s,title:'Confirmă dimensiunile și cumpărăturile',body:'Verifică dimensiunile organizatoarelor și compatibilitatea accesoriilor. Începe cu ce ai deja.',time:'20–30 min'};
   if(s.id==='task-5')return {...s,title:'Testează aranjamentul, înainte de cumpărături',body:'Așază accesoriile și mostrele în cameră. Verifică deschiderea ușilor, accesul și proporțiile.',time:'20–30 min'};
   if(s.id==='task-6')return {...s,title:'Realizează schimbările fără finisare',body:'Rearanjează, organizează și adaugă doar textilele sau accesoriile independente alese. Păstrează obiectele funcționale.',time:'45–90 min'};
   if(s.id==='task-7')return {...s,title:'Verifică detaliile și stabilitatea',body:state.profile.tenure==='renter'?'Păstrează piesele fixe și originale. Folosește accesorii independente; cere acordul proprietarului pentru orice intervenție.':'Verifică accesoriile și organizatoarele. Nu bloca deschiderea ușilor, accesul la robineți sau prize.',time:'20–30 min'};
  }return s;
 });
}
function ranking(){const p=state.profile;return data.actions.filter(a=>a.rooms.includes(p.room)||a.rooms.includes('all')||p.room==='all').filter(a=>!(p.room==='bath'&&a.id==='clean')).map(a=>({...a,score:a.impact*3-a.effort+(a.issue===p.issue?7:0)+(p.goal==='sale'?a.sale:a.rent)+(p.condition==='worn'&&a.issue==='worn'?4:0)-(p.budget<500?(a.cost-1)*3:0)})).sort((a,b)=>b.score-a.score||a.cost-b.cost).slice(0,5);}
function allocation(){const list=ranking(),active=list.filter(a=>!state.excluded.includes(a.id)),available=state.profile.budget*.85,weight=active.reduce((s,a)=>s+a.cost,0);let used=0;return list.map(a=>{const included=!state.excluded.includes(a.id),envelope=!included?0:a.id===active.at(-1)?.id?Math.max(0,Math.floor(available)-used):Math.floor(available*a.cost/weight);used+=envelope;return {...a,envelope,included};});}
function stageSteps(){const list=ranking();return [
 {id:'stage-0',day:'prepare',group:'Înainte să începi',title:'Separă reparațiile de prezentare',body:'Notează defecțiunile, umezeala sau problemele de siguranță. Rezolvarea și evaluarea lor vin înaintea schimbărilor estetice.',time:'20–30 min'},
 {id:'stage-1',day:'prepare',group:'Înainte să începi',title:'Fotografiază și cere prețuri',body:'Fă fotografii de referință din ușă și obține prețuri pentru intervențiile alese. Completează costurile în calculator.',time:'30–45 min'},
 ...list.filter(a=>a.id!=='photos'&&!state.excluded.includes(a.id)).slice(0,3).map((a,i)=>({id:'stage-action-'+a.id,day:i<2?'day1':'day2',group:i<2?'Ziua 1 · Schimbările principale':'Ziua 2 · Detalii și verificare',title:a.title,body:a.do,time:a.effort===1?'20–40 min':'45–90 min'})),
 {id:'stage-photos',day:'finish',group:'Ziua 2 · Pregătire finală',title:'Pregătește fotografiile și vizionarea',body:'Parcurge lista pentru fotografii, compară cu imaginile inițiale și verifică dacă spațiul arată corect și în realitate.',time:'45–60 min'}];}
function progress(){const arr=activeSteps();return [arr.filter(s=>state.checks[s.id]).length,arr.length];}
function toolbar(cls='tools'){return `<div class="${cls}"><button data-action="print">Imprimă / salvează PDF</button><button data-action="export">Salvează o copie</button><button data-action="import">Încarcă o copie</button><button data-action="reset">Începe un proiect nou</button></div>`;}
function render(){const s=getScheme(),[done,total]=progress();
 document.body.dataset.tab=state.tab;
 document.getElementById('app').innerHTML=`<header class="topbar"><div class="shell"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 15 16 4l12 11v13H4V15Z" stroke="currentColor" stroke-width="1.6"/><path d="M12 28V17h8v11" stroke="currentColor" stroke-width="1.6"/></svg><span>ACASĂ<small>RENOVARE REZOLVATĂ</small></span></div><span class="edition">${data.edition}</span></div></header>
 <main class="shell"><section class="hero"><div><div class="eyebrow">${staging?'DECIZII MAI CLARE, ÎNAINTE DE VIZIONARE':'FĂRĂ NICIO COMBINAȚIE GREȘITĂ'}</div><h1>${data.title}<br><em>${data.subtitle}</em></h1><p>${data.intro}</p><div class="hero-facts"><span><b>${staging?'Priorități explicate':'6 combinații'}</b></span><span><b>${staging?'Buget controlat':'Listă editabilă'}</b></span><span><b>Progres salvat</b></span></div></div><aside class="mini-board"><div class="eyebrow">${staging?'PLANUL TĂU, ÎN ORDINE':'PALETA PROIECTULUI TĂU'}</div><div class="mini-title">${staging?data.short:esc(s.name)}</div><div class="swatch-row">${(s?.colors||['#dbc9af','#a88164','#8e9a85','#635265']).map(c=>`<i style="background:${c}"></i>`).join('')}</div><div class="mini-foot">${staging?'Camera + problema principală + buget → un plan de acțiune':'Combinație orientativă · confirmă nuanțele pe mostre reale'}</div></aside></section>
 <div class="workspace"><aside class="sidebar"><div class="side-heading">${staging?'CALCULATORUL TĂU':'PLANIFICATORUL TĂU'}</div><nav class="nav" aria-label="Pașii proiectului">${tabs.map(([id,title],i)=>`<button data-tab="${id}" class="${state.tab===id?'active':''}" ${state.tab===id?'aria-current="step"':''}><span class="step-no">${i+1}</span>${title}</button>`).join('')}</nav><div class="progress-card"><p>Planul tău de lucru</p><strong>${done}<span style="font-size:13px;color:var(--muted)"> / ${total}</span></strong><div class="progress-track"><i style="width:${done/total*100}%"></i></div><p>pași finalizați</p></div><p class="save-state" data-save>${saveText()}</p>${toolbar()}</aside><div class="content">${tabs.map(([id])=>`<section class="tab-panel" id="panel-${id}" ${id!==state.tab?'hidden':''}>${view(id)}</section>`).join('')}${toolbar('mobile-tools')}</div></div></main>
 <footer class="footer"><div class="shell"><span>RENOVARE REZOLVATĂ · ${data.name}</span><span>Proiectul rămâne în browserul tău. Pentru transfer, salvează o copie.</span></div></footer><input type="file" id="backup-file" accept="application/json,.json" hidden>`;
 const board=document.querySelector('.mini-board');
 board.classList.add('visual-board');
 board.innerHTML=staging?`<img class="hero-photo" src="${asset('staging-after.webp')}" alt="Exemplu ilustrativ de living pregătit pentru vizionare" width="768" height="768"><div class="photo-caption"><small>EXEMPLU DE PREZENTARE</small><strong>Ordine. Lumină. Coerență.</strong></div>`:`${photo(s,'hero-photo')}<div class="photo-caption"><small>PALETA PROIECTULUI TĂU</small><strong>${esc(s.name)}</strong><div class="swatch-row">${s.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div></div>`;
 if(!staging){
  document.querySelectorAll('[data-scheme]').forEach(el=>{const item=data.schemes.find(s=>s.id===el.dataset.scheme);el.insertAdjacentHTML('afterbegin',photo(item));});
  document.querySelector('.selected-details')?.insertAdjacentHTML('afterbegin',photo(s,'selected-photo'));
 }else document.querySelector('#panel-photos .panel-intro')?.insertAdjacentHTML('afterend',compareView());
 bind();
 RENOVARE_UI.mount(uiContext());
}
function uiContext(){return {kind,data,state,staging,esc,money,asset,photo,getScheme,activeSteps,ranking,allocation,progress,go,save,render,toast,action};}
function view(id){return ({dashboard:()=>RENOVARE_UI.dashboard(uiContext()),project:projectView,schemes:schemesView,plan:planView,shopping:shoppingView,ideas:ideasView,ranking:rankingView,photos:photosView}[id])();}
function projectView(){const p=state.profile;return `<div class="panel"><div class="section-label">01 · PUNCTUL DE PLECARE</div><h2>${staging?'Ce pregătești pentru vizionare?':'Mai întâi, proiectul tău.'}</h2><p class="panel-intro">${staging?'Răspunde la câteva întrebări. Ordinea propusă ține cont de problema principală, efort și buget.':'Câteva alegeri utile. Le poți schimba oricând; lista și progresul rămân ale tale.'}</p><form id="project-form"><div class="form-grid"><label class="field">Numele proiectului<input name="name" value="${esc(p.name)}" maxlength="80" required></label><label class="field">Buget disponibil · lei<input name="budget" type="number" min="0" max="10000000" step="1" value="${p.budget}" required><small>Introdu suma ta, inclusiv materialele și manopera.</small></label>
 ${staging?select('goal','Pregătesc locuința pentru',[['sale','Vânzare'],['rent','Închiriere']])+select('room','Camera pe care o prioritizez',[['living','Living'],['bedroom','Dormitor'],['kitchen','Bucătărie'],['bath','Baie'],['hall','Hol / intrare'],['all','Întreaga locuință']])+select('condition','Starea actuală',[['good','Funcțională, dar nearmonioasă'],['worn','Urme de uzură la vedere'],['technical','Defecțiuni / umezeală de evaluat']])+select('issue','Ce se observă prima dată?',[['clutter','Aglomerație / spațiu încărcat'],['dark','Lumină insuficientă'],['worn','Uzură și detalii neîngrijite'],['mixed','Culori și decor necoordonate']]):select('style','Atmosfera dorită',[['natural','Naturală și liniștită'],['modern','Modernă și ordonată'],['warm','Caldă, cu personalitate']])+select('keep',data.keepLabel,data.keepOptions)+select('tenure','Locuința este',[['owner','Proprietatea mea'],['renter','Închiriată — schimbări reversibile']])+select('scope','Ce vrei să schimbi?',[['refresh','Organizare, textile și accesorii'],['finish','Și aspectul mobilierului existent']],'În chirie, planul rămâne axat pe accesorii independente.')}
 <label class="field span-all">Observațiile tale<textarea name="notes" maxlength="4000" placeholder="Dimensiuni, piese de păstrat, ce ai deja…">${esc(state.notes)}</textarea></label></div><div class="actions"><button class="primary" type="submit">${staging?'Calculează prioritățile':'Vezi combinațiile potrivite'} <span aria-hidden="true">→</span></button><span style="font-size:10px;color:var(--muted)">Alegerile se salvează automat.</span></div></form><div class="note">${staging?'Calculatorul organizează deciziile. Nu estimează prețul proprietății sau un câștig garantat; efectul depinde de piață și de starea reală.':'Planul îți organizează un weekend de schimbări simple. Uscarea și întărirea unor materiale pot depăși 48 de ore; urmează instrucțiunile produsului.'}</div></div>`;}
function schemesView(){if(staging)return '';const ordered=recommended(),s=getScheme();return `<div class="panel"><div class="section-label">02 · ALEGE DIRECȚIA</div><h2>O combinație. Mai puține îndoieli.</h2><p class="panel-intro">Primele opțiuni sunt ordonate după preferințele tale. Paletele coordonează culori și aspecte; nu sunt randări ale camerei tale.</p><div class="scheme-grid">${ordered.map((x,i)=>`<button class="scheme ${x.id===s.id?'selected':''}" data-scheme="${x.id}" aria-pressed="${x.id===s.id}"><div class="scheme-swatches">${x.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div>${x.id===s.id?'<span class="scheme-check" aria-hidden="true">✓</span>':''}<div class="scheme-copy"><h3>${x.name}</h3><p>${x.parts[0]} · ${x.parts[1]}</p><span class="chip">${i===0?'Prima sugestie pentru tine':x.style==='modern'?'Modern':x.style==='warm'?'Cald':'Natural'}</span></div></button>`).join('')}</div><div class="selected-details"><div class="section-label">COMBINAȚIA SALVATĂ</div><h3>${s.name}</h3><p style="font-size:12px;margin-top:8px">${s.why}</p><div class="material-grid">${s.parts.map((p,i)=>`<div class="material"><i style="background:${s.colors[i]}"></i><div><strong>${data.partLabels[i]}</strong><small>${p}</small></div></div>`).join('')}</div><div class="note"><strong>Verifică înainte să cumperi:</strong> ${s.avoid} ${state.profile.keep!=='none'&&!s.keep.includes(state.profile.keep)?'<br>Această paletă nu este prima potrivire pentru finisajul pe care îl păstrezi. Compară mostrele înainte de orice comandă.':''}</div></div><div class="actions"><button class="primary" data-tab="plan">Continuă cu planul →</button></div></div>`;}
function planView(){const steps=activeSteps();let prev='';return `<div class="panel"><div class="section-label">${staging?'03':'03'} · ORDINEA CONTEAZĂ</div><h2>Weekendul tău, pas cu pas.</h2><p class="panel-intro">Bifează fiecare pas după ce l-ai terminat. Duratele sunt orientative și depind de dimensiuni, pregătire și materialele alese.</p>${!staging?`<div class="plan-summary"><h3>${esc(state.profile.name)}</h3><p>${esc(getScheme().name)} · ${money(state.profile.budget)} · ${state.profile.tenure==='renter'?'Schimbări reversibile':state.profile.scope==='finish'?'Finisare + organizare':'Organizare + accesorii'}</p></div>`:''}${steps.map(s=>{const head=s.day!==prev?`<div class="timeline-head"><span>${s.day==='prepare'?'ÎNAINTE':s.day==='day1'?'01':s.day==='day2'?'02':'FINAL'}</span><h3>${s.group}</h3></div>`:'';prev=s.day;return head+`<label class="check-row ${state.checks[s.id]?'done':''}"><input type="checkbox" data-check="${s.id}" ${state.checks[s.id]?'checked':''}><div><h3>${s.title}</h3><p>${s.body}</p><span class="time-tag">${s.time}</span></div></label>`;}).join('')}<div class="note">${staging?'Dacă sunt necesare reparații sau intervenții specializate, fă-le înainte de prezentare și ajustează calendarul. Fotografiile nu trebuie să ascundă problemele.':state.profile.tenure==='renter'?'Pentru schimbări ale elementelor fixe, cere mai întâi acordul proprietarului. Un produs „detașabil” poate lăsa urme.':'Lucrează pe suprafețe sănătoase. Instalațiile electrice, racordurile și problemele de umezeală se verifică separat cu un specialist.'}</div><div class="actions"><button class="primary" data-tab="${staging?'photos':'shopping'}">${staging?'Pregătește fotografiile':'Deschide lista de cumpărături'} →</button></div></div>`;}
function shoppingView(){if(staging)return '';const total=state.cart.reduce((sum,x)=>sum+x.qty*(x.price??0),0),missing=state.cart.filter(x=>x.price===null&&x.qty>0).length;return `<div class="panel"><div class="section-label">04 · CUMPĂRĂ CU UN PLAN</div><h2>Lista ta, cu prețurile tale.</h2><p class="panel-intro">Lista de pornire este editabilă. Șterge ce ai deja sau nu folosești, adaugă cantitățile măsurate și introdu prețurile găsite de tine. Nu sunt prețuri de magazin preîncărcate.</p><div class="budget-strip"><div><small>Buget</small><strong>${money(state.profile.budget)}</strong></div><div><small>Total completat</small><strong>${money(total)}</strong></div><div><small>${total>state.profile.budget?'Peste buget':'Disponibil provizoriu'}</small><strong class="${total>state.profile.budget?'over':''}">${money(Math.abs(state.profile.budget-total))}</strong></div></div><p style="font-size:11px;margin-bottom:20px">${missing?`${missing} poziții fără preț. Totalul este incomplet.`:'Toate pozițiile au preț. Verifică și transportul, consumabilele și manopera.'}</p><div class="list-head"><span></span><span>Articol</span><span>Cant.</span><span>Lei / unit.</span><span></span></div>${state.cart.length?state.cart.map((x,i)=>`<div class="shopping-row"><input type="checkbox" data-cart-done="${i}" ${x.done?'checked':''} aria-label="Cumpărat: ${esc(x.name)}"><div class="item-name" style="${x.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(x.name)}<small>${esc(x.detail)}</small></div><input type="number" min="0" max="10000" step="0.01" value="${x.qty}" data-cart-qty="${i}" aria-label="Cantitate: ${esc(x.name)}"><input type="number" min="0" max="10000000" step="0.01" value="${x.price??''}" placeholder="—" data-cart-price="${i}" aria-label="Preț unitar: ${esc(x.name)}"><button class="remove" data-remove="${i}" aria-label="Șterge: ${esc(x.name)}">×</button></div>`).join(''):'<div class="empty">Lista este goală. Adaugă primul articol mai jos.</div>'}<form id="add-item" class="add-row"><input name="item" placeholder="Adaugă un articol, transport sau manoperă…" maxlength="100" aria-label="Articol nou" required><button class="secondary">+ Adaugă</button></form>${state.profile.scope==='finish'&&state.profile.tenure==='owner'?'<div class="actions"><button class="secondary" data-action="finish-items">Adaugă articole pentru finisare</button></div>':''}<div class="note">Paleta aleasă: <strong>${getScheme().name}</strong>. Notează dimensiunile și condițiile de utilizare înainte de comandă. Păstrează o rezervă pentru consumabile și situații neprevăzute.</div></div>`;}
function ideasView(){if(staging)return '';return `<div class="panel"><div class="section-label">05 · DETALII CARE FAC DIFERENȚA</div><h2>12 idei de pus în practică.</h2><p class="panel-intro">Alege ce rezolvă o problemă reală în ${data.room} ta. Deschide fiecare idee pentru recomandări și verificări înainte de cumpărare.</p>${data.tips.map((t,i)=>`<details class="solution"><summary><span>${String(i+1).padStart(2,'0')} · ${t[0]}</span></summary><p>${t[1]}</p><div class="label">DE VERIFICAT</div><p>${t[2]}</p></details>`).join('')}</div>`;}
function rankingView(){if(!staging)return '';const list=allocation(),p=state.profile,known=list.filter(a=>!state.excluded.includes(a.id)).reduce((s,a)=>s+(state.quotes[a.id]??0),0),missing=list.filter(a=>!state.excluded.includes(a.id)&&state.quotes[a.id]===undefined).length;return `<div class="panel"><div class="section-label">02 · CE MERITĂ FĂCUT PRIMUL</div><h2>Ordinea ta de priorități.</h2><p class="panel-intro">${esc(p.name)} · ${p.goal==='sale'?'Vânzare':'Închiriere'} · buget ${money(p.budget)}. Ordinea este o recomandare de prezentare, nu o evaluare imobiliară.</p>${p.condition==='technical'?'<div class="note"><strong>Primul pas: verificarea defecțiunilor.</strong> Rezervă bugetul necesar evaluării și reparațiilor înainte de home staging. Dacă bugetul afișat le include, scade mai întâi aceste costuri din proiect.</div>':''}<div class="budget-strip"><div><small>Buget total</small><strong>${money(p.budget)}</strong></div><div><small>Rezervă orientativă · 15%</small><strong>${money(p.budget*.15)}</strong></div><div><small>Costuri completate</small><strong class="${known>p.budget?'over':''}">${money(known)}</strong></div></div><p style="font-size:11px">${missing?`${missing} priorități fără cost introdus. Verificarea bugetului este incompletă.`:known>p.budget?'Costurile depășesc bugetul. Amână intervențiile de mai jos sau actualizează suma.':known>p.budget*.85?'Costurile intră în buget, dar consumă o parte din rezerva de 15%.':'Costurile completate se încadrează în bugetul de lucru, cu rezerva păstrată.'}</p>${list.map((a,i)=>`<article class="rank-card"><div class="rank-top"><span class="rank-number">${i+1}</span><div class="rank-copy"><h3>${a.title}</h3><p>${a.why}</p><div class="rank-meta"><span class="chip">Vizibilitate ${a.impact}/5</span><span class="chip">Efort ${a.effort===1?'redus':a.effort===2?'mediu':'mai mare'}</span>${a.issue===p.issue?'<span class="chip">Răspunde problemei tale</span>':''}</div></div></div><div class="rank-budget"><div><label>Plafon propus · nu preț de piață</label><strong style="display:block">${money(a.envelope)}</strong><div class="status">${state.quotes[a.id]===undefined?'Adaugă prețul înainte să decizi.':state.quotes[a.id]>a.envelope?'Peste plafonul propus — compară alternative.':'În plafonul propus.'}</div></div><label>Costul estimat de tine · lei<input type="number" min="0" max="10000000" step="1" placeholder="—" data-quote="${a.id}" value="${state.quotes[a.id]??''}" aria-label="Cost estimat: ${a.title}"></label></div><details><summary>Ce fac concret și ce cumpăr?</summary><p><strong>Pași:</strong> ${a.do}</p><p><strong>Listă de verificat:</strong> ${a.buy}</p><p><strong>De evitat:</strong> ${a.avoid}</p></details></article>`).join('')}<details class="solution"><summary>Cum sunt calculate recomandările?</summary><p>Scorul pornește de la vizibilitate (×3), scade efortul și adaugă puncte pentru problema principală, starea camerei și scopul vânzare/închiriere. La bugete sub 500 lei, intervențiile cu consum mai mare de resurse sunt coborâte în listă. Scorurile sunt reguli editoriale, nu date despre randamentul investițiilor.</p><p>15% din buget rămâne rezervă. Restul se împarte între cele cinci priorități, proporțional cu nivelul orientativ de resurse. Plafoanele sunt sume de planificare: nu confirmă că lucrările pot fi executate la acel preț. Introdu prețuri reale și ajustează lista înainte de cumpărături.</p><p>Fotografiile se fac la final, chiar dacă apar sus în clasament. Reparațiile necesare au prioritate față de orice schimbare decorativă.</p></details><div class="actions"><button class="primary" data-tab="plan">Organizează următoarele 48 de ore →</button></div></div>`;}
const photoTasks=[['photo-1','Eliberează cadrul','Strânge obiectele personale, coșurile, cablurile și produsele în surplus.'],['photo-2','Pregătește lumina','Fotografiază ziua. Aprinde becurile necesare și verifică dacă luminile au culori apropiate.'],['photo-3','Alege unghiuri utile','Arată camera din două colțuri, cu telefonul drept. Păstrează o perspectivă realistă.'],['photo-4','Verifică reflexiile','Controlează oglinzile, geamurile și ecranele; evită apariția persoanelor sau datelor personale.'],['photo-5','Arată funcția camerei','Pat aranjat, masă utilizabilă, blat liber; fiecare spațiu trebuie să aibă un scop clar.'],['photo-6','Fă un tur înainte de vizionare','Verifică accesul, aerisirea, curățenia și funcționarea elementelor pe care le prezinți.'],['photo-7','Compară cu realitatea','Alege fotografii clare și corecte. Nu ascunde defectele și nu modifica artificial dimensiunile.']];
function photosView(){if(!staging)return '';return `<div class="panel"><div class="section-label">04 · ULTIMA IMPRESIE CONTEAZĂ</div><h2>Pregătită pentru fotografii.</h2><p class="panel-intro">Folosește lista după schimbările prioritare. Bifele se salvează separat de planul de lucru.</p>${photoTasks.map(([id,title,body])=>`<label class="check-row ${state.checks[id]?'done':''}"><input type="checkbox" data-check="${id}" ${state.checks[id]?'checked':''}><div><h3>${title}</h3><p>${body}</p></div></label>`).join('')}<div class="actions"><button class="primary" data-action="print">Imprimă planul complet →</button></div></div>`;}
function go(tab){state.tab=tab;save();render();document.querySelector('.content').scrollIntoView({behavior:'smooth',block:'start'});}
function bind(){
 document.querySelectorAll('[data-compare]').forEach(el=>el.oninput=()=>{const c=el.closest('.comparison');c.querySelector('.comparison-before').style.clipPath=`inset(0 ${100-Number(el.value)}% 0 0)`;c.querySelector('.compare-handle').style.left=el.value+'%';});
 document.querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
 const form=document.getElementById('project-form');
 form.addEventListener('input',()=>{readProfile(form);save();});
 form.addEventListener('change',()=>{readProfile(form);save();});
 form.addEventListener('submit',e=>{e.preventDefault();readProfile(form);state.profileReady=true;if(!staging)state.scheme=recommended()[0].id;go(staging?'ranking':'schemes');});
 document.querySelectorAll('[data-scheme]').forEach(b=>b.onclick=()=>{state.scheme=b.dataset.scheme;save();render();toast('Combinația a fost salvată.');});
 document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.checks[el.dataset.check]=el.checked;save();const y=window.scrollY;render();window.scrollTo(0,y);});
 document.querySelectorAll('[data-cart-done]').forEach(el=>el.onchange=()=>updateCart(el,'done',el.checked));
 document.querySelectorAll('[data-cart-qty]').forEach(el=>el.oninput=()=>updateCart(el,'qty',num(el.value,1,10000)));
 document.querySelectorAll('[data-cart-price]').forEach(el=>el.oninput=()=>updateCart(el,'price',el.value===''?null:num(el.value)));
 document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{state.cart.splice(Number(el.dataset.remove),1);save();render();});
 document.querySelectorAll('[data-quote]').forEach(el=>el.oninput=()=>{if(el.value==='')delete state.quotes[el.dataset.quote];else state.quotes[el.dataset.quote]=num(el.value);save();refreshQuoteTotals();});
 const add=document.getElementById('add-item');if(add)add.onsubmit=e=>{e.preventDefault();const name=new FormData(add).get('item').trim();if(!name)return;if(state.cart.length>=100){toast('Lista poate avea maximum 100 de poziții.');return;}state.cart.push({id:'custom-'+Date.now(),name:name.slice(0,100),detail:'Articol adăugat de tine',qty:1,price:null,done:false});save();render();document.querySelector('#add-item input').focus();};
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
 document.getElementById('backup-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Fișierul este prea mare.');const next=cleanState(JSON.parse(await file.text()));if(!confirm('Înlocuiești proiectul curent cu această copie? Salvează-l mai întâi dacă vrei să îl păstrezi.'))return;state=next;save();render();toast('Proiect încărcat.');}catch(err){toast(err.message==='Fișierul nu aparține acestui instrument.'?err.message:'Copia nu poate fi citită. Alege un fișier salvat din acest instrument.');}};
}
function readProfile(form){const fd=new FormData(form);for(const k of Object.keys(state.profile)){if(fd.has(k))state.profile[k]=k==='budget'?num(fd.get(k),1500):String(fd.get(k)).slice(0,k==='name'?80:30);}state.notes=String(fd.get('notes')||'').slice(0,4000);}
function updateCart(el,prop,value){const i=Number(el.dataset.cartDone??el.dataset.cartQty??el.dataset.cartPrice);if(!state.cart[i])return;state.cart[i][prop]=value;save();if(prop==='done'){const name=el.closest('.shopping-row').querySelector('.item-name');name.style.textDecoration=value?'line-through':'';name.style.color=value?'var(--muted)':'';return;}const panel=document.querySelector('#panel-shopping'),stats=panel.querySelectorAll('.budget-strip strong'),total=state.cart.reduce((s,x)=>s+x.qty*(x.price??0),0),missing=state.cart.filter(x=>x.price===null&&x.qty>0).length;stats[1].textContent=money(total);stats[2].textContent=money(Math.abs(state.profile.budget-total));stats[2].classList.toggle('over',total>state.profile.budget);stats[2].previousElementSibling.textContent=total>state.profile.budget?'Peste buget':'Disponibil provizoriu';panel.querySelector('.budget-strip').nextElementSibling.textContent=missing?`${missing} poziții fără preț. Totalul este incomplet.`:'Toate pozițiile au preț. Verifică și transportul, consumabilele și manopera.';}
function refreshQuoteTotals(){const list=allocation(),total=list.filter(a=>!state.excluded.includes(a.id)).reduce((s,a)=>s+(state.quotes[a.id]??0),0),missing=list.filter(a=>!state.excluded.includes(a.id)&&state.quotes[a.id]===undefined).length,panel=document.querySelector('#panel-ranking'),stats=panel.querySelectorAll('.budget-strip strong');stats[2].textContent=money(total);stats[2].classList.toggle('over',total>state.profile.budget);panel.querySelector('.budget-strip').nextElementSibling.textContent=missing?`${missing} priorități fără cost introdus. Verificarea bugetului este incompletă.`:total>state.profile.budget?'Costurile depășesc bugetul. Amână intervențiile de mai jos sau actualizează suma.':total>state.profile.budget*.85?'Costurile intră în buget, dar consumă o parte din rezerva de 15%.':'Costurile completate se încadrează în bugetul de lucru, cu rezerva păstrată.';list.forEach(a=>{const el=panel.querySelector(`[data-quote="${a.id}"]`);el.closest('.rank-card').querySelector('.status').textContent=!a.included?'Exclus din plan și din total.':state.quotes[a.id]===undefined?'Adaugă prețul înainte să decizi.':state.quotes[a.id]>a.envelope?'Peste plafonul propus — compară alternative.':'În plafonul propus.';});}
function action(type){
 if(type==='print'){readProfile(document.getElementById('project-form'));save();window.print();}
 if(type==='export'){readProfile(document.getElementById('project-form'));save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='renovare-'+kind+'-proiect.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia proiectului a fost pregătită pentru descărcare.');}
 if(type==='import')document.getElementById('backup-file').click();
 if(type==='reset'){if(!confirm('Începi un proiect nou? Salvează o copie dacă vrei să păstrezi proiectul curent.'))return;state=initial();cartDefaults();save();render();window.scrollTo(0,0);}
 if(type==='finish-items'){data.extraShop.forEach(([name,detail,qty],i)=>{if(!state.cart.some(x=>x.name===name))state.cart.push({id:'extra-'+i,name,detail,qty,price:null,done:false,extra:true});});save();render();toast('Articolele pentru finisare au fost adăugate.');}
}
render();
})();
</script></body></html>
